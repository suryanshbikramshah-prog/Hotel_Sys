<!-- register.html -->
<form id="registerForm" novalidate>
  <div class="form-group">
    <label for="name">Full Name</label>
    <input type="text" id="name" class="form-control" required>
    <span class="error-msg" id="e-name">Name is required.</span>
  </div>
  <div class="form-group">
    <label for="email">Email Address</label>
    <input type="email" id="email" class="form-control" required>
    <span class="error-msg" id="e-email">Enter a valid email.</span>
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" class="form-control" required>
    <span class="error-msg" id="e-password">Min 6 characters.</span>
  </div>
  <button type="submit" class="btn btn-primary btn-large" style="width:100%">Register</button>
  <p style="text-align:center; margin-top:1rem">
    Already have an account? <a href="login.html">Sign In</a>
  </p>
</form>

<script>
document.getElementById('registerForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!name || !email || password.length < 6) return;

  // Save to localStorage
  const users = JSON.parse(localStorage.getItem('hotel_users') || '[]');
  if (users.find(u => u.email === email)) {
    alert('Email already registered!'); return;
  }
  users.push({ name, email, password });
  localStorage.setItem('hotel_users', JSON.stringify(users));
  alert('Registered! Please log in.');
  window.location.href = 'login.html';
});
</script>
